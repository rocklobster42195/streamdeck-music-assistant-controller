name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tools/build-translator.mjs uses git blame

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck -w music-assistant-client
      - run: npm test
      - run: npm run lint
      - run: npm run validate -w mac-plugin

      - name: Generated API types match docs/ma-api
        run: npm run gen:api && git diff --exit-code -- packages/ma-client/src/generated

      - name: Translation data is up to date
        # translate/data.json is generated by the build and committed; a diff means it was not rebuilt
        run: git diff --exit-code -- translate/data.json || (echo "::warning::translate/data.json is outdated — run npm run build and commit it")
