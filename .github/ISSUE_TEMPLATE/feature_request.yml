name: Feature request
description: Suggest a new action, option or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the situation, not only the solution ("When I come home, I want to …").
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could MA-C help? Which key or dial, what should it show, what should pressing or rotating do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: How do you do it today? Anything similar in another plugin?

  - type: input
    id: ma-command
    attributes:
      label: Music Assistant API (if you know it)
      description: E.g. `player_queues/play_media`. Not required.

  - type: dropdown
    id: device
    attributes:
      label: Stream Deck model
      multiple: true
      options:
        - Stream Deck + (dials)
        - Stream Deck (keys only)
        - Stream Deck Mobile
        - Other
