<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play Item</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Play Item"></mac-key-preview>

  <pi-section title="pi.item" class="pi-needs-connection">
    <mac-item-picker></mac-item-picker>
  </pi-section>

  <pi-section title="pi.play_mode">
    <pi-choice setting="option" default="replace" columns="3" data-options='[
      {"value":"replace","label":"pi.opt_replace","icon":"playNow"},
      {"value":"next","label":"pi.opt_next","icon":"playNext"},
      {"value":"add","label":"pi.opt_add","icon":"addToQueue"}
    ]'></pi-choice>
  </pi-section>
  <div class="pi-hint mac-cmd-hint" data-show-when="option=replace" data-show-default="replace" data-i18n="pi.opt_hint_replace"></div>
  <div class="pi-hint mac-cmd-hint" data-show-when="option=next" data-i18n="pi.opt_hint_next"></div>
  <div class="pi-hint mac-cmd-hint" data-show-when="option=add" data-i18n="pi.opt_hint_add"></div>

  <pi-section title="pi.display">
    <pi-toggle setting="showName" label="pi.show_item_name" hint="pi.show_item_name_hint"></pi-toggle>
  </pi-section>

  <pi-section class="pi-win" title="pi.icon_color">
    <pi-toggle setting="iconCoverColor" label="pi.icon_cover_color" hint="pi.icon_cover_color_hint"></pi-toggle>
  </pi-section>

  <pi-section class="pi-win" title="pi.marker">
    <pi-icon-picker setting="marker" none-label="pi.marker_none" reset-label="pi.marker_remove" hint="pi.marker_hint"></pi-icon-picker>
  </pi-section>

  <pi-section title="pi.player" class="pi-needs-connection">
    <mac-player-picker setting="playerId"></mac-player-picker>
  </pi-section>

  <pi-more></pi-more>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MA-C</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
