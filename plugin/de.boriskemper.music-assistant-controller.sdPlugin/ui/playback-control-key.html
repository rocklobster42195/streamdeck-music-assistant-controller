<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playback Control</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Playback Control"></mac-key-preview>

  <pi-section title="pi.command">
    <pi-choice setting="command" default="next" columns="3" data-options='[
      {"value":"previous","label":"pi.cmd_previous","icon":"previous"},
      {"value":"next","label":"pi.cmd_next","icon":"next"},
      {"value":"shuffle","label":"pi.cmd_shuffle","icon":"shuffle"},
      {"value":"repeat","label":"pi.cmd_repeat","icon":"repeat"},
      {"value":"crossfade","label":"pi.cmd_crossfade","icon":"crossfade"},
      {"value":"dont_stop","label":"pi.cmd_dont_stop","icon":"dontStop"}
    ]'></pi-choice>
  </pi-section>
  <div class="pi-hint mac-cmd-hint" data-show-when="command=next,previous" data-show-default="next" data-i18n="pi.cmd_skip_hint"></div>
  <div class="pi-hint mac-cmd-hint" data-show-when="command=repeat" data-i18n="pi.cmd_repeat_hint"></div>
  <div class="pi-hint mac-cmd-hint" data-show-when="command=dont_stop" data-i18n="pi.cmd_dont_stop_hint"></div>
  <div data-show-when="command=next,previous" data-show-default="next">
    <pi-section title="kit.seek_step">
      <pi-choice setting="seekStep" columns="4" default="10" data-options='[
        {"value":"5","label":"5 s"},
        {"value":"10","label":"10 s"},
        {"value":"15","label":"15 s"},
        {"value":"30","label":"30 s"}
      ]'></pi-choice>
      <div class="pi-hint" data-i18n="kit.seek_step_hint"></div>
    </pi-section>
  </div>
  <pi-section title="pi.crossfade_setup" class="pi-needs-connection pi-win" data-show-when="command=crossfade">
    <mac-flow-mode></mac-flow-mode>
  </pi-section>
  <div class="pi-hint mac-cmd-hint pi-win" data-show-when="command=crossfade" data-i18n="pi.cmd_crossfade_hint"></div>

  <pi-section class="pi-win" title="pi.icon_color">
    <pi-key-color setting="keyColor" grey-label="pi.key_color_default" grey-hint="pi.key_color_default_hint"></pi-key-color>
  </pi-section>

  <pi-section class="pi-win" title="pi.marker">
    <pi-icon-picker setting="marker" none-label="pi.marker_none" reset-label="pi.marker_remove" hint="pi.marker_hint"></pi-icon-picker>
  </pi-section>

  <pi-section title="pi.player">
    <pi-select setting="player" source="players" placeholder="kit.player_active"></pi-select>
  </pi-section>

  <pi-more></pi-more>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MA-C</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
