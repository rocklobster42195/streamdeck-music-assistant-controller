<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volume</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Volume"></mac-key-preview>

  <pi-section title="pi.command">
    <pi-choice setting="command" default="up" columns="4" data-options='[
      {"value":"down","label":"pi.vol_down","icon":"volumeDown"},
      {"value":"up","label":"pi.vol_up","icon":"volumeUp"},
      {"value":"mute","label":"pi.vol_mute","icon":"volumeOff"},
      {"value":"preset","label":"pi.vol_preset","icon":"volumeMedium"}
    ]'></pi-choice>
  </pi-section>

  <pi-section class="pi-win" title="pi.volume_settings" data-show-when="command=up,down,preset" data-show-default="up">
    <pi-range setting="step" min="1" max="20" step="1" default="5" unit="%" label="pi.vol_step" data-show-when="command=up,down" data-show-default="up"></pi-range>
    <pi-range setting="preset" min="0" max="100" step="1" default="20" unit="%" label="pi.vol_preset_value" data-show-when="command=preset" data-show-default="up"></pi-range>
  </pi-section>

  <pi-section title="pi.gauge" data-show-when="command=mute" data-show-default="up">
    <pi-choice setting="gauge" default="ring" columns="3" data-options='[
      {"value":"ring","label":"pi.gauge_ring","icon":"gaugeRing"},
      {"value":"pie","label":"pi.gauge_pie","icon":"gaugePie"},
      {"value":"open","label":"pi.gauge_open","icon":"gaugeOpen"}
    ]'></pi-choice>
  </pi-section>

  <pi-section title="pi.display" data-show-when="command=up,down,mute" data-show-default="up">
    <pi-toggle setting="showVolume" label="pi.vol_show_value" hint="pi.vol_show_value_hint" data-default="true"></pi-toggle>
  </pi-section>

  <pi-section class="pi-win" title="pi.icon_color">
    <pi-key-color setting="keyColor" grey-label="pi.key_color_default" grey-hint="pi.key_color_default_hint"></pi-key-color>
  </pi-section>

  <pi-section class="pi-win" title="pi.marker">
    <pi-icon-picker setting="marker" none-label="pi.marker_none" reset-label="pi.marker_remove" hint="pi.marker_hint"></pi-icon-picker>
  </pi-section>

  <pi-section title="pi.player">
    <pi-select setting="player" source="players" placeholder="kit.player_active"></pi-select>
  </pi-section>

  <pi-section class="pi-win" title="kit.call_title">
    <pi-call-reaction></pi-call-reaction>
  </pi-section>
  <pi-more></pi-more>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MA-C</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
