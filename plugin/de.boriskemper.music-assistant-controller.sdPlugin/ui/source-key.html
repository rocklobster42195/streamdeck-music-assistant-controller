<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Source</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Source"></mac-key-preview>
  <div class="pi-hint mac-cmd-hint mac-dial-help" data-i18n="pi.source_help"></div>

  <pi-section title="pi.source" class="pi-needs-connection">
    <mac-select setting="source" source="player-sources" label-setting="sourceName" with-player placeholder="pi.choose_source" empty="pi.no_sources"></mac-select>
  </pi-section>

  <pi-section title="pi.icon_color">
    <pi-toggle setting="iconCoverColor" label="pi.icon_cover_color" hint="pi.icon_cover_color_hint"></pi-toggle>
  </pi-section>

  <pi-section title="pi.player" class="pi-needs-connection">
    <mac-player-picker setting="playerId"></mac-player-picker>
  </pi-section>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MAC</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
