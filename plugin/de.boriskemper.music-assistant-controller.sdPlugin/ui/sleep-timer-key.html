<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sleep Timer</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Sleep Timer"></mac-key-preview>
  <div class="pi-hint mac-cmd-hint mac-dial-help" data-i18n="pi.sleep_help"></div>

  <pi-section title="pi.sleep_steps">
    <pi-field setting="steps" label="pi.sleep_steps_label" placeholder="pi.sleep_steps_placeholder" hint="pi.sleep_steps_hint"></pi-field>
  </pi-section>

  <pi-section class="pi-win" title="pi.sleep_fade">
    <pi-range setting="fadeOut" min="0" max="120" step="5" default="30" unit=" s" label="pi.sleep_fade_label"></pi-range>
    <div class="pi-hint" data-i18n="pi.sleep_fade_hint"></div>
  </pi-section>

  <pi-section class="pi-win" title="pi.icon_color">
    <pi-key-color setting="keyColor" grey-label="pi.key_color_default" grey-hint="pi.key_color_default_hint"></pi-key-color>
  </pi-section>

  <pi-section class="pi-win" title="pi.marker">
    <pi-icon-picker setting="marker" none-label="pi.marker_none" reset-label="pi.marker_remove" hint="pi.marker_hint"></pi-icon-picker>
  </pi-section>

  <pi-section title="pi.player" class="pi-needs-connection">
    <mac-player-picker setting="playerId"></mac-player-picker>
  </pi-section>

  <pi-more></pi-more>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MA-C</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
