<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Player"></mac-key-preview>
  <div class="pi-hint mac-cmd-hint mac-dial-help" data-i18n="pi.player_key_help"></div>

  <pi-section title="pi.player_room" class="pi-needs-connection">
    <mac-player-picker setting="playerId" no-follow></mac-player-picker>
  </pi-section>

  <pi-section title="pi.display">
    <pi-toggle setting="transfer" label="pi.transfer" hint="pi.transfer_hint" data-default="true"></pi-toggle>
    <pi-toggle setting="showCover" label="pi.show_cover" hint="pi.show_cover_hint" data-default="true"></pi-toggle>
  </pi-section>

  <pi-section title="pi.icon_color">
    <pi-toggle setting="iconCoverColor" label="pi.icon_cover_color" hint="pi.icon_cover_color_hint"></pi-toggle>
  </pi-section>

  <pi-section title="pi.marker">
    <pi-icon-picker setting="marker" none-label="pi.marker_none" reset-label="pi.marker_remove" hint="pi.marker_hint_room"></pi-icon-picker>
  </pi-section>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MA-C</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
