<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Queue</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Queue"></mac-key-preview>
  <div class="pi-hint mac-cmd-hint mac-dial-help" data-i18n="pi.dial_queue_help"></div>

  <pi-section title="pi.dial_controls">
    <pi-range setting="timeout" min="3" max="60" step="1" default="10" unit=" s" label="pi.queue_timeout"></pi-range>
  </pi-section>

  <pi-section title="pi.background">
    <mac-effect-settings allow-none></mac-effect-settings>
  </pi-section>
  <div class="pi-hint mac-cmd-hint" data-i18n="pi.background_hint"></div>

  <pi-section title="pi.player" class="pi-needs-connection">
    <mac-player-picker setting="playerId"></mac-player-picker>
  </pi-section>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MA-C</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
