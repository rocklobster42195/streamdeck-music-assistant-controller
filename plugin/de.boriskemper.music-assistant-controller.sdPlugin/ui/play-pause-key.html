<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play/Pause</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Play/Pause"></mac-key-preview>

  <pi-section title="pi.marker">
    <mac-icon-picker setting="marker" none-label="pi.marker_none" reset-label="pi.marker_remove" hint="pi.marker_hint"></mac-icon-picker>
  </pi-section>

  <pi-section title="pi.player" class="pi-needs-connection">
    <mac-player-picker setting="playerId"></mac-player-picker>
  </pi-section>

  <pi-section title="pi.display">
    <pi-toggle setting="showPlayerName" label="pi.show_player_name" hint="pi.show_player_name_hint"></pi-toggle>
    <pi-toggle setting="showTitle" label="pi.show_title" hint="pi.show_title_hint"></pi-toggle>
    <pi-toggle setting="showProgress" label="pi.show_progress" hint="pi.show_progress_hint"></pi-toggle>
    <pi-toggle setting="showProvider" label="pi.show_provider" hint="pi.show_provider_hint"></pi-toggle>
  </pi-section>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MA-C</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
