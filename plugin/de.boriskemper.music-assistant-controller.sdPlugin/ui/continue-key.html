<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Continue Listening</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Continue Listening"></mac-key-preview>
  <div class="pi-hint mac-cmd-hint mac-dial-help" data-i18n="pi.continue_help"></div>

  <pi-section title="pi.continue_kind">
    <pi-choice setting="kind" default="any" columns="3" data-options='[
      {"value":"any","label":"pi.continue_any","icon":"continueAny"},
      {"value":"audiobook","label":"pi.continue_audiobooks","icon":"audiobook"},
      {"value":"podcast_episode","label":"pi.continue_podcasts","icon":"podcast"}
    ]'></pi-choice>
  </pi-section>

  <pi-section title="pi.display">
    <pi-toggle setting="showName" label="pi.show_item_name" hint="pi.show_item_name_hint" data-default="true"></pi-toggle>
  </pi-section>

  <pi-section title="pi.player" class="pi-needs-connection">
    <mac-player-picker setting="playerId"></mac-player-picker>
  </pi-section>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MAC</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
