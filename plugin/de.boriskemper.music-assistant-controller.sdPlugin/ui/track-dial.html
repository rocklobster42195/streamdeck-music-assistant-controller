<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Track dial</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Track"></mac-key-preview>

  <div class="pi-hint mac-cmd-hint mac-dial-help" data-i18n="pi.dial_track_rotate"></div>

  <pi-section class="pi-win" title="pi.dial_controls">
    <pi-range setting="seekStep" min="1" max="60" step="1" default="10" unit=" s" label="pi.dial_seek_step"></pi-range>
  </pi-section>

  <pi-section title="pi.display">
    <pi-toggle setting="showProvider" label="pi.show_provider" hint="pi.show_provider_hint"></pi-toggle>
  </pi-section>

  <pi-panorama class="pi-win"></pi-panorama>

  <pi-section class="pi-win" title="pi.panorama_colour">
    <pi-toggle setting="coverColor" label="pi.cover_color" hint="pi.cover_color_hint" data-default="true"></pi-toggle>
  </pi-section>

  <pi-section title="pi.player" class="pi-needs-connection">
    <mac-player-picker setting="playerId"></mac-player-picker>
  </pi-section>

  <pi-panorama class="pi-pi-only" summary></pi-panorama>

  <pi-more></pi-more>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MA-C</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
