<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panorama</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Panorama"></mac-key-preview>
  <div class="pi-hint mac-cmd-hint mac-dial-help" data-i18n="pi.panorama_help"></div>

  <pi-section title="pi.effect">
    <mac-effect-settings no-auto allow-none default-effect="particles"></mac-effect-settings>
  </pi-section>

  <pi-section title="pi.overlay">
    <pi-choice setting="text" default="off" columns="3" data-options='[
      {"value":"off","label":"pi.overlay_off","icon":"textOff"},
      {"value":"track","label":"pi.overlay_track","icon":"trackInfo"},
      {"value":"lyrics","label":"pi.overlay_lyrics","icon":"lyrics"}
    ]'></pi-choice>
  </pi-section>
  <div class="pi-hint mac-cmd-hint" data-i18n="pi.overlay_hint"></div>

  <pi-section title="pi.overlay_lyrics" data-show-when="text=lyrics" data-show-default="off">
    <pi-range setting="lyricsOffset" min="-10" max="5" step="0.1" default="0.5" unit=" s" label="pi.lyrics_offset" data-fn-icon="timing"></pi-range>
  </pi-section>
  <div class="pi-hint mac-cmd-hint" data-show-when="text=lyrics" data-show-default="off" data-i18n="pi.lyrics_hint"></div>

  <pi-section title="pi.audio_source" data-audio-source hidden>
    <pi-select setting="audioSource" source="audio-sources" with="audio-source" label-setting="audioSourceName" placeholder="pi.audio_none"></pi-select>
  </pi-section>
  <div class="pi-hint mac-cmd-hint" data-audio-source hidden data-i18n="pi.audio_hint"></div>

  <pi-section title="pi.player" class="pi-needs-connection">
    <mac-player-picker setting="playerId"></mac-player-picker>
  </pi-section>
  <div class="pi-hint mac-cmd-hint" data-i18n="pi.panorama_player_hint"></div>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MA-C</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
