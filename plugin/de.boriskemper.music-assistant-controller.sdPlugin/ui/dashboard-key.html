<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cast Dashboard</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Cast Dashboard"></mac-key-preview>
  <div class="pi-hint mac-cmd-hint mac-dial-help" data-i18n="pi.dashboard_help"></div>

  <pi-section title="pi.dashboard_screen" class="pi-needs-connection">
    <mac-select setting="dashboardId" source="dashboards" label-setting="dashboardName" placeholder="pi.choose_screen" empty="pi.no_screens"></mac-select>
  </pi-section>

  <pi-section title="pi.dashboard_view">
    <pi-choice setting="dashboard" default="now_playing" columns="3" data-options='[
      {"value":"now_playing","label":"pi.dashboard_now_playing","icon":"playNow"},
      {"value":"party","label":"pi.dashboard_party","icon":"speakers"},
      {"value":"music_quiz","label":"pi.dashboard_quiz","icon":"quiz"}
    ]'></pi-choice>
  </pi-section>

  <pi-section title="pi.icon_color">
    <pi-toggle setting="iconCoverColor" label="pi.icon_cover_color" hint="pi.icon_cover_color_hint"></pi-toggle>
  </pi-section>

  <pi-section title="pi.player" class="pi-needs-connection" data-show-when="dashboard=now_playing" data-show-default="now_playing">
    <mac-player-picker setting="playerId"></mac-player-picker>
  </pi-section>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MAC</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
