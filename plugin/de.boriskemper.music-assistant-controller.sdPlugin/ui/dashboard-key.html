<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cast Dashboard</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="mac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <mac-key-preview label="Cast Dashboard"></mac-key-preview>
  <div class="pi-hint mac-cmd-hint mac-dial-help" data-i18n="pi.dashboard_help"></div>

  <pi-section title="pi.dashboard_screen" class="pi-needs-connection">
    <pi-select setting="dashboardId" source="dashboards" label-setting="dashboardName" placeholder="pi.choose_screen" empty="pi.no_screens"></pi-select>
  </pi-section>

  <pi-section title="pi.dashboard_view">
    <pi-choice setting="dashboard" default="now_playing" columns="3" data-options='[
      {"value":"now_playing","label":"pi.dashboard_now_playing","icon":"playNow"},
      {"value":"party","label":"pi.dashboard_party","icon":"speakers"},
      {"value":"music_quiz","label":"pi.dashboard_quiz","icon":"quiz"}
    ]'></pi-choice>
  </pi-section>

  <pi-section class="pi-win" title="pi.icon_color">
    <pi-key-color setting="keyColor" grey-label="pi.key_color_default" grey-hint="pi.key_color_default_hint"></pi-key-color>
  </pi-section>

  <pi-section class="pi-win" title="pi.marker">
    <pi-icon-picker setting="marker" none-label="pi.marker_none" reset-label="pi.marker_remove" hint="pi.marker_hint"></pi-icon-picker>
  </pi-section>

  <pi-section title="pi.player" class="pi-needs-connection" data-show-when="dashboard=now_playing" data-show-default="now_playing">
    <mac-player-picker setting="playerId"></mac-player-picker>
  </pi-section>

  <pi-more></pi-more>

  <mac-connection-card></mac-connection-card>

  <div class="pi-footer"><span data-plugin-version>MA-C</span><a href="https://github.com/rocklobster42195/streamdeck-music-assistant-controller" data-i18n="pi.help">Help &amp; feedback</a></div>
</body>

</html>
